<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="THYNACT">
  <title>THYNACT</title>
  <!-- The compact mark only — never the wordmark, which is illegible at 16px.
       Pinned to light ink on a dark tile rather than following currentColor: a
       favicon has no page ink to inherit and must hold against both light and
       dark browser chrome. Geometry matches ThynactLogo.tsx exactly. -->
  <defs>
    <linearGradient id="a" gradientUnits="userSpaceOnUse" x1="46" y1="0" x2="59" y2="0">
      <stop offset="0%" stop-color="#eef1f6"/><stop offset="48%" stop-color="#eef1f6"/>
      <stop offset="68%" stop-color="#a8842f"/><stop offset="100%" stop-color="#e3c98a"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0b1220"/>
  <g stroke-linecap="round" stroke-linejoin="round" fill="none"
     transform="translate(32 33) scale(0.76) translate(-32 -32)">
    <path d="M10.9 5 H59.1" stroke="#eef1f6" stroke-width="3"/>
    <path d="M35.1 5 V30" stroke="#eef1f6" stroke-width="3.6"/>
    <path d="M5.7 59.5 C11 58.8 16.5 54 19.6 48.8 C22.5 44.5 25.5 38.5 29.7 34.3 C33.5 28.6 42.5 28.6 46.2 34.3 C50.5 39.5 55 48 58.6 59.3" stroke="url(#a)" stroke-width="3.6"/>
  </g>
</svg>
