[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-os"
version = "0.1.0"
description = "Python-first multi-agent Agent OS"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "httpx>=0.27,<1",
    "google-genai>=1.0,<2",
]

[project.optional-dependencies]
persistence = [
    "asyncpg>=0.29,<1",
    "redis>=5,<6",
]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "httpx>=0.27,<1",
    "ruff>=0.6,<1",
    "asyncpg>=0.29,<1",
    "redis>=5,<6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"


[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "infra*", "migrations*", "scripts*"]
